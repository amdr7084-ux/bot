name: CI - build & deploy

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}
          tags: ${{ secrets.DOCKER_IMAGE_NAME }}

      - name: Call Wispbyte deploy endpoint
        if: secrets.WISPBYTE_DEPLOY_URL && secrets.WISPBYTE_API_KEY
        run: |
          curl -sS -X POST "$${{ secrets.WISPBYTE_DEPLOY_URL }}" \
            -H "Authorization: Bearer $${{ secrets.WISPBYTE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{ \"image\": \"${{ secrets.DOCKER_IMAGE_NAME }}\" }"
