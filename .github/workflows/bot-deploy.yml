name: Bot - build & deploy

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image for bot
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN && secrets.DOCKER_IMAGE_NAME }}
          tags: ${{ secrets.DOCKER_IMAGE_NAME }}

      - name: Call Wispbyte deploy API
        if: secrets.WISPBYTE_DEPLOY_URL && secrets.WISPBYTE_API_KEY && secrets.DOCKER_IMAGE_NAME
        run: |
          curl -sS -X POST "$${{ secrets.WISPBYTE_DEPLOY_URL }}" \
            -H "Authorization: Bearer $${{ secrets.WISPBYTE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{ \"image\": \"${{ secrets.DOCKER_IMAGE_NAME }}\", \"manifest\": $(cat wispbyte.json) }"
